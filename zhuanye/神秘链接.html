<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>浪漫花园</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #667eea, #764ba2, #6B5B95);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            color: white;
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* 飘落的花瓣 */
        .floating-petal {
            position: absolute;
            font-size: 24px;
            animation: floatDown 8s linear infinite;
            z-index: 1;
        }

        @keyframes floatDown {
            0% {
                transform: translateY(-20px) rotate(0deg);
                opacity: 0;
            }
            10% {
                opacity: 1;
            }
            90% {
                opacity: 1;
            }
            100% {
                transform: translateY(100vh) rotate(360deg);
                opacity: 0;
            }
        }

        /* 中心欢迎信息 */
        .welcome-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10000;
            backdrop-filter: blur(5px);
        }

        .welcome-content {
            text-align: center;
            background: rgba(108, 99, 165, 0.9);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            border: 2px solid rgba(255, 255, 255, 0.2);
            animation: pulse 2s infinite;
        }

        .welcome-text {
            font-size: 3rem;
            color: #FF69B4;
            text-shadow: 0 0 20px rgba(255, 105, 180, 0.8);
            margin-bottom: 20px;
            animation: fadeInOut 4s ease-in-out forwards;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        @keyframes fadeInOut {
            0% { opacity: 0; transform: scale(0.8); }
            30% { opacity: 1; transform: scale(1.1); }
            70% { opacity: 1; transform: scale(1.1); }
            100% { opacity: 0; transform: scale(0.8); }
        }

        /* 主要内容 */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            position: relative;
            z-index: 2;
        }

        /* 标题样式 */
        .main-title {
            text-align: center;
            font-size: 4rem;
            margin: 50px 0;
            color: #FFB6C1;
            text-shadow: 0 0 20px rgba(255, 182, 193, 0.8);
            animation: glow 2s ease-in-out infinite alternate;
        }

        @keyframes glow {
            from { text-shadow: 0 0 10px #fff, 0 0 20px #fff, 0 0 30px #FF69B4, 0 0 40px #FF69B4; }
            to { text-shadow: 0 0 20px #fff, 0 0 30px #FF1493, 0 0 40px #FF1493, 0 0 50px #FF1493; }
        }

        /* 浪漫诗句区域 */
        .poem-container {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 30px;
            margin: 30px auto;
            max-width: 800px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
        }

        .poem {
            font-size: 1.5rem;
            line-height: 1.8;
            text-align: center;
            color: #FFB6C1;
            font-style: italic;
        }

        /* 心形动画 */
        .heart {
            position: absolute;
            font-size: 20px;
            animation: floatHeart 6s ease-in-out infinite;
            z-index: 2;
        }

        @keyframes floatHeart {
            0% {
                transform: translateY(0) scale(0);
                opacity: 0;
            }
            10% {
                opacity: 1;
                transform: translateY(-100px) scale(1);
            }
            90% {
                opacity: 1;
                transform: translateY(-300px) scale(1);
            }
            100% {
                transform: translateY(-400px) scale(0);
                opacity: 0;
            }
        }

        /* 彩蛋样式 */
        .easter-egg {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.9);
            color: #FF69B4;
            padding: 30px;
            border-radius: 15px;
            z-index: 9999;
            text-align: center;
            max-width: 80%;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            border: 2px solid #FF69B4;
            display: none;
        }

        .easter-egg.show {
            display: block;
            animation: popIn 0.5s ease;
        }

        @keyframes popIn {
            0% { transform: translate(-50%, -50%) scale(0.5); opacity: 0; }
            100% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
        }

        .easter-egg h3 {
            margin-bottom: 15px;
            color: #FFB6C1;
        }

        .easter-egg p {
            margin-bottom: 20px;
            line-height: 1.6;
        }

        .close-btn {
            background: #FF69B4;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 10px;
        }

        /* 点击效果 */
        .click-effect {
            position: absolute;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: rgba(255, 105, 180, 0.6);
            pointer-events: none;
            animation: ripple 0.8s linear;
        }

        @keyframes ripple {
            0% { transform: scale(0); opacity: 1; }
            100% { transform: scale(4); opacity: 0; }
        }

        /* 神秘按钮 */
        .mystery-btn {
            position: fixed;
            bottom: 30px;
            right: 30px;
            width: 60px;
            height: 60px;
            background: linear-gradient(45deg, #FF69B4, #FF1493);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            z-index: 1000;
            animation: float 3s ease-in-out infinite;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
        }

        .mystery-btn::before {
            content: "?";
            color: white;
            font-size: 1.8rem;
            font-weight: bold;
        }

        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0px); }
        }

        .mystery-btn:hover {
            transform: scale(1.1);
            box-shadow: 0 8px 25px rgba(255, 105, 180, 0.6);
        }

        /* 响应式设计 */
        @media (max-width: 768px) {
            .main-title {
                font-size: 2.5rem;
            }
            
            .poem {
                font-size: 1.2rem;
            }
            
            .welcome-text {
                font-size: 2rem;
            }
        }
    </style>
</head>
<body>
    <!-- 飘落的花瓣 -->
    <div class="petals-container"></div>

    <!-- 中心欢迎信息 -->
    <div class="welcome-overlay" id="welcomeOverlay">
        <div class="welcome-content">
            <div class="welcome-text">爱你宝贝儿</div>
        </div>
    </div>

    <!-- 主要内容 -->
    <div class="container">
        <h1 class="main-title">浪漫花园</h1>
        
        <div class="poem-container">
            <div class="poem">
                在这个慵懒的午后<br>
                时光如诗般流淌<br>
                每一片花瓣都诉说着爱意<br>
                每一缕微风都传递着思念<br>
                <br>
                你是我心中的星辰<br>
                照亮了黑暗的夜空<br>
                你是我梦中的花园<br>
                绽放着永恒的芬芳<br>
                <br>
                愿时光慢些，再慢些<br>
                让我们静静感受这份美好<br>
                在这片小天地里<br>
                爱意如花般绽放
            </div>
        </div>
    </div>

    <!-- 彩蛋容器 -->
    <div class="easter-egg" id="easterEgg1">
        <h3>✨ 意外的发现</h3>
        <p>你找到了第一个彩蛋！<br>在爱的世界里，每一个细节都值得珍藏。</p>
        <button class="close-btn" onclick="closeEasterEgg('easterEgg1')">关闭</button>
    </div>

    <div class="easter-egg" id="easterEgg2">
        <h3>💖 爱的密码</h3>
        <p>原来你也在寻找爱的痕迹<br>记住，真正的爱需要用心体会。</p>
        <button class="close-btn" onclick="closeEasterEgg('easterEgg2')">关闭</button>
    </div>

    <div class="easter-egg" id="easterEgg3">
        <h3>🌟 永恒的承诺</h3>
        <p>感谢你发现了这个秘密<br>愿我们的爱如这花园般永远绽放。</p>
        <button class="close-btn" onclick="closeEasterEgg('easterEgg3')">关闭</button>
    </div>

    <!-- 神秘按钮 -->
    <div class="mystery-btn" id="mysteryBtn" title="点击有惊喜"></div>

    <script>
        // 页面加载完成后处理欢迎信息
        document.addEventListener('DOMContentLoaded', function() {
            // 4秒后隐藏欢迎信息
            setTimeout(function() {
                const welcomeOverlay = document.getElementById('welcomeOverlay');
                welcomeOverlay.style.animation = 'fadeInOut 1s ease-in-out forwards';
                setTimeout(() => {
                    welcomeOverlay.style.display = 'none';
                }, 1000);
            }, 4000);

            // 创建飘落的花瓣
            createFloatingPetals();
        });

        // 创建飘落的花瓣
        function createFloatingPetals() {
            const petalsContainer = document.querySelector('.petals-container');
            const petals = ['🌸', '🌹', '🌺', '🌸', '🌷', '🌼', '🌺', '🌹'];
            
            setInterval(() => {
                const petal = document.createElement('div');
                petal.className = 'floating-petal';
                petal.textContent = petals[Math.floor(Math.random() * petals.length)];
                petal.style.left = Math.random() * 100 + 'vw';
                petal.style.animationDuration = (Math.random() * 4 + 6) + 's';
                petal.style.fontSize = (Math.random() * 20 + 15) + 'px';
                document.body.appendChild(petal);
                
                // 10秒后移除花瓣
                setTimeout(() => {
                    petal.remove();
                }, 10000);
            }, 300);
        }

        // 点击页面任意位置出现心形
        document.addEventListener('click', function(e) {
            // 创建心形
            const heart = document.createElement('div');
            heart.className = 'heart';
            heart.textContent = '❤';
            heart.style.left = e.clientX + 'px';
            heart.style.top = e.clientY + 'px';
            heart.style.fontSize = (Math.random() * 20 + 20) + 'px';
            document.body.appendChild(heart);
            
            // 6秒后移除心形
            setTimeout(() => {
                heart.remove();
            }, 6000);
        });

        // 点击页面出现涟漪效果
        document.addEventListener('click', function(e) {
            const ripple = document.createElement('div');
            ripple.className = 'click-effect';
            ripple.style.left = e.clientX + 'px';
            ripple.style.top = e.clientY + 'px';
            document.body.appendChild(ripple);
            
            setTimeout(() => {
                ripple.remove();
            }, 800);
        });

        // 彩蛋1: 快速点击标题5次显示特殊消息
        let titleClickCount = 0;
        let titleClickTimeout;
        document.querySelector('.main-title').addEventListener('click', function() {
            titleClickCount++;
            
            if (titleClickTimeout) {
                clearTimeout(titleClickTimeout);
            }
            
            titleClickTimeout = setTimeout(() => {
                titleClickCount = 0;
            }, 1000);
            
            if (titleClickCount === 5) {
                showEasterEgg('easterEgg1');
                titleClickCount = 0;
            }
        });

        // 彩蛋2: 点击诗句区域显示彩蛋
        document.querySelector('.poem').addEventListener('click', function() {
            // 随机显示彩蛋2的概率为20%
            if (Math.random() < 0.2) {
                showEasterEgg('easterEgg2');
            }
        });

        // 彩蛋3: 神秘按钮
        document.getElementById('mysteryBtn').addEventListener('click', function() {
            showEasterEgg('easterEgg3');
        });

        // 彩蛋4: 按特定键组合显示彩蛋 (I L O V E)
        let keySequence = [];
        const secretCode = ['i', 'l', 'o', 'v', 'e'];
        
        document.addEventListener('keydown', function(e) {
            const key = e.key.toLowerCase();
            if (secretCode.includes(key)) {
                keySequence.push(key);
                
                if (keySequence.length > secretCode.length) {
                    keySequence.shift();
                }
                
                if (keySequence.length === secretCode.length) {
                    let isMatch = true;
                    for (let i = 0; i < secretCode.length; i++) {
                        if (keySequence[i] !== secretCode[i]) {
                            isMatch = false;
                            break;
                        }
                    }
                    
                    if (isMatch) {
                        // 显示特殊彩蛋
                        const specialEgg = document.createElement('div');
                        specialEgg.className = 'easter-egg';
                        specialEgg.innerHTML = `
                            <h3>💕 爱的密码</h3>
                            <p>你解开了爱的密码！<br>I LOVE E = I LOVE YOU<br>这是专属于你的浪漫秘密</p>
                            <button class="close-btn" onclick="this.parentElement.remove()">关闭</button>
                        `;
                        specialEgg.style.display = 'block';
                        specialEgg.style.animation = 'popIn 0.5s ease';
                        document.body.appendChild(specialEgg);
                        
                        keySequence = [];
                    }
                }
            } else {
                keySequence = [];
            }
        });

        // 彩蛋5: 鼠标悬停在页面上时出现小惊喜
        let hoverCount = 0;
        document.addEventListener('mousemove', function(e) {
            hoverCount++;
            if (hoverCount % 100 === 0) { // 每移动100次触发一次
                const heart = document.createElement('div');
                heart.className = 'heart';
                heart.textContent = ['💖', '💕', '💗', '💓'][Math.floor(Math.random() * 4)];
                heart.style.left = e.clientX + 'px';
                heart.style.top = e.clientY + 'px';
                heart.style.fontSize = '25px';
                document.body.appendChild(heart);
                
                setTimeout(() => {
                    heart.remove();
                }, 3000);
            }
        });

        // 显示彩蛋函数
        function showEasterEgg(eggId) {
            const egg = document.getElementById(eggId);
            egg.classList.add('show');
            
            // 10秒后自动隐藏
            setTimeout(() => {
                closeEasterEgg(eggId);
            }, 10000);
        }

        // 关闭彩蛋函数
        function closeEasterEgg(eggId) {
            const egg = document.getElementById(eggId);
            egg.classList.remove('show');
        }

        // 彩蛋6: 页面加载后随机出现惊喜
        setTimeout(() => {
            if (Math.random() < 0.3) { // 30%概率
                const surprise = document.createElement('div');
                surprise.style.position = 'fixed';
                surprise.style.top = '20px';
                surprise.style.left = '50%';
                surprise.style.transform = 'translateX(-50%)';
                surprise.style.background = 'rgba(255, 105, 180, 0.9)';
                surprise.style.color = 'white';
                surprise.style.padding = '15px 30px';
                surprise.style.borderRadius = '25px';
                surprise.style.zIndex = '9998';
                surprise.style.fontSize = '1.2rem';
                surprise.style.boxShadow = '0 5px 15px rgba(0,0,0,0.3)';
                surprise.style.animation = 'fadeInOut 4s ease-in-out forwards';
                surprise.innerHTML = '💕 今天也是爱你的一天！';
                document.body.appendChild(surprise);
                
                setTimeout(() => {
                    surprise.remove();
                }, 4000);
            }
        }, 8000);
    </script>
</body>
</html>
